<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0d13">
<title>Aviator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
<canvas id="trail"></canvas>
<div id="topBar">
<div id="status">Waiting for next round</div>
<div id="balance">RS <span id="balVal">25,000</span></div>
</div>
<div id="history"></div>
<div id="multiplier">1.00x</div>
<div id="plane">🚀</div>
<div id="flewAway">FLEW AWAY!<br><span>Better luck next round</span></div>
<div id="toast"></div>
<div id="userStats">
<div class="stat"><span id="totalBets">0</span><small>Bets</small></div>
<div class="stat"><span id="totalWins">0</span><small>Wins</small></div>
</div>
<div id="betsPanel">
<div id="betsHeader">
<div class="title"><span class="live-dot"></span><span>Live Bets</span><span class="count" id="betsCount">(0)</span></div>
<div class="arrow">▲</div>
</div>
<div id="betsCols">
<div>Player</div><div class="right">Bet</div><div class="right">Multiplier</div><div class="right">Payout</div>
</div>
<div id="betsList"></div>
</div>
<div id="panel">
<div id="quickRow">
<button class="stepBtn" id="minusBtn">−</button>
<input id="betInput" type="number" value="100" min="10" step="10" inputmode="numeric" />
<button class="stepBtn" id="plusBtn">+</button>
</div>
<div id="presets">
<button class="preset" data-val="100">100</button>
<button class="preset" data-val="150">150</button>
<button class="preset" data-val="200">200</button>
<button class="preset" data-val="500">500</button>
<button class="preset" data-val="1000">1K</button>
</div>
<div id="autoRow">
<label>Auto Cashout</label>
<input id="autoInput" type="number" placeholder="e.g. 2.00x" min="1.1" step="0.1" inputmode="decimal" />
</div>
<div id="actionRow">
<button class="action" id="betBtn"><span class="label">BET</span><span class="sub" id="betSub">RS 100</span></button>
<button class="action" id="cashBtn" disabled><span class="label">CASH OUT</span><span class="sub" id="cashSub">—</span></button>
</div>
</div>
</div>
<script src="script.js"></script>
</body>
</html>
