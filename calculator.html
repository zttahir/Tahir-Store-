<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Calculator</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  user-select:none;
  font-family:sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body{
  background:#e0e0e0;
  height:100vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

/* Rain layer */
.rain{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}

/* rain drops */
.drop{
  position:absolute;
  top:-50px;
  width:18px;
  height:18px;
  background:white;
  border-radius:50%;
  opacity:0.8;
  animation: fall linear infinite;
  box-shadow: 0 0 10px rgba(255,255,255,0.6);
}

/* ZT letters */
.ztdrop{
  position:absolute;
  top:-50px;
  font-size:16px;
  font-weight:bold;
  color:#333;
  opacity:0.6;
  animation: fall linear infinite;
}

/* fall animation */
@keyframes fall{
  0%{ transform:translateY(-60px); }
  100%{ transform:translateY(110vh); }
}

/* Display */
.display{
  width:90%;
  margin:20px auto;
  padding:20px;
  border-radius:20px;
  background:#e0e0e0;
  box-shadow: inset 5px 5px 10px #bebebe,
              inset -5px -5px 10px #ffffff;
  font-size:24px;
  text-align:right;
  color:#333;
  z-index:1;
}

/* Buttons */
.buttons{
  margin-top:auto;
  padding:15px;
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:15px;
  z-index:1;
}

.btn{
  padding:18px;
  text-align:center;
  border-radius:15px;
  background:#e0e0e0;
  box-shadow:5px 5px 10px #bebebe,
             -5px -5px 10px #ffffff;
  font-size:18px;
  color:#555;
  cursor:pointer;
  transition:0.15s;
}

.btn:active{
  transform: scale(0.95);
  box-shadow: inset 5px 5px 10px #bebebe,
              inset -5px -5px 10px #ffffff;
}

.equal{
  grid-column: span 2;
}
</style>
</head>

<body>

<div class="rain" id="rain"></div>

<div id="display" class="display">0</div>

<div class="buttons">
  <div class="btn" onclick="clearAll()">AC</div>
  <div class="btn" onclick="del()">⌫</div>
  <div class="btn" onclick="add('%')">%</div>
  <div class="btn" onclick="add('/')">÷</div>

  <div class="btn" onclick="add('7')">7</div>
  <div class="btn" onclick="add('8')">8</div>
  <div class="btn" onclick="add('9')">9</div>
  <div class="btn" onclick="add('*')">×</div>

  <div class="btn" onclick="add('4')">4</div>
  <div class="btn" onclick="add('5')">5</div>
  <div class="btn" onclick="add('6')">6</div>
  <div class="btn" onclick="add('-')">−</div>

  <div class="btn" onclick="add('1')">1</div>
  <div class="btn" onclick="add('2')">2</div>
  <div class="btn" onclick="add('3')">3</div>
  <div class="btn" onclick="add('+')">+</div>

  <div class="btn" onclick="add('0')">0</div>
  <div class="btn" onclick="add('.')">.</div>
  <div class="btn equal" onclick="calculate()">=</div>
</div>

<script>

let display = document.getElementById("display");
let rain = document.getElementById("rain");

/* calculator */
function add(val){
  if(display.innerText === "0"){
    display.innerText = val;
  } else {
    display.innerText += val;
  }
}

function clearAll(){
  display.innerText = "0";
}

function del(){
  let text = display.innerText;
  if(text.length > 1){
    display.innerText = text.slice(0, -1);
  } else {
    display.innerText = "0";
  }
}

function calculate(){
  try{
    display.innerText = eval(display.innerText);
  }catch{
    display.innerText = "Error";
  }
}

/* 🌧️ Rain */
function createDrop(){
  const drop = document.createElement("div");
  drop.classList.add("drop");

  drop.style.left = Math.random() * 100 + "vw";

  let size = Math.random() * 10 + 14;
  drop.style.width = size + "px";
  drop.style.height = size + "px";

  drop.style.animationDuration = (Math.random() * 2 + 2.5) + "s";

  rain.appendChild(drop);

  setTimeout(() => {
    drop.remove();
  }, 6000);
}

/* 🔤 ZT letters (LOW frequency) */
function createZT(){
  const zt = document.createElement("div");
  zt.classList.add("ztdrop");

  zt.innerText = "ZT";

  zt.style.left = Math.random() * 100 + "vw";
  zt.style.animationDuration = (Math.random() * 3 + 3) + "s";

  let size = Math.random() * 4 + 14;
  zt.style.fontSize = size + "px";

  rain.appendChild(zt);

  setTimeout(() => {
    zt.remove();
  }, 7000);
}

/* intervals */
setInterval(createDrop, 80);
setInterval(createZT, 1500);

</script>

</body>
</html>
