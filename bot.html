button{outline:0;border:0}
.del,.send{width:40px;height:40px;border-radius:13px;margin-left:5px}
.del{background:#292f39;color:#aaa}.send{background:#00AEEF;color:#fff;font-size:18px}
.footer{text-align:center;color:#555;font-size:9px;margin-top:5px}

</style>
</head>

<body>

<div class="app">

</div>

<script>

const chat=document.getElementById("chat");
const inp=document.getElementById("inp");

const data=[

},

{
k:["download video","videos download","video download","video kese download","video kaise download","video kaisy download","how to download","how can i download","how to use this app","app kaise use","app kese use","tiktok saver use"],
r:`<b>Bilkul bro 😄 Video download karne ka method:</b>
<div class="step">1️⃣ TikTok video ka link copy karke input box mein paste karein.</div>

},

{

r:`<b>Without Watermark download karna hai? 😄</b>
<div class="step">1️⃣ Video link paste karein.</div>
<div class="step">2️⃣ <b>Without Watermark</b> checkbox check karein.</div>
<div class="step">3️⃣ Video chahiye to Audio Only unchecked rakhein.</div>
<div class="step">4️⃣ Play press karein.</div>
<div class="step">5️⃣ Information load hone ke baad Download Video press karein.</div>`
},

{
k:["audio","audio only","only audio","audio download","sound download","music download","sirf audio","audio kese download","audio kaise download"],
r:`<b>Sirf audio download karni hai? 🎵</b>
<div class="step">1️⃣ TikTok link paste karein.</div>

},

},

{
k:["3 dots","three dots","video options","rename video","delete video","share video","video info","3 dot menu"],
r:`<b>3-dot menu 😄</b><br><br>

Available options mein <b>Rename, Delete, Share</b> aur <b>Video Info</b> check kar sakte hain.

},

{

r:`<b>Link paste karne ka method:</b><br><br>
TikTok → Share → Copy Link → ZT Saver → Input box mein link paste karein → Play press karein. 😄`
},

{
k:["play button","play kab","play kaise","link dalne ke baad","paste link then what","next step"],
r:`Link paste karne ke baad <b>Play</b> button press karein 😄<br><br>
Phir video/profile information load hone dein. Uske baad Download Video button press karein.`
},

{
k:["download nahi","download nahi ho rahi","download error","download failed","download problem","download start nahi","video save nahi"],
r:`<b>Download problem aa rahi hai? 😅</b>

<div class="step">2️⃣ Valid TikTok link use karein.</div>
<div class="step">3️⃣ Play press karke information load hone dein.</div>
<div class="step">4️⃣ Phir Download Video press karein.</div>`
}

];


function norm(s){

return s.toLowerCase()
.replace(/kese|kesy|kasy|kaisy/g,"kaise")
.replace(/kro|kr/g,"karo")
.replace(/kia/g,"kya")
.replace(/ap/g,"aap")
.replace(/vidio|vedio/g,"video")
.replace(/dowload|downlod|dwonload/g,"download")
.replace(/nhi|nai/g,"nahi")
.replace(/[^\w\s]/g," ")
.replace(/\s+/g," ")
.trim();

}


function lev(a,b){

let x=[...Array(b.length+1)].map((_,i)=>[i]);

for(let j=0;j<=a.length;j++)
x[0][j]=j;

for(let i=1;i<=b.length;i++)
for(let j=1;j<=a.length;j++)
x[i][j]=b[i-1]==a[j-1]
?x[i-1][j-1]
:Math.min(
x[i-1][j]+1,
x[i][j-1]+1,
x[i-1][j-1]+1
);

return x[b.length][a.length];

}


function sim(a,b){

a=norm(a).split(" ");
b=norm(b).split(" ");

let hit=0;

a.forEach(x=>{

if(x.length<2)return;

b.forEach(y=>{

if(x==y)hit++;

else if(x.length>3&&y.length>3){

let d=lev(x,y);

if(d<=1||d/Math.max(x.length,y.length)<.3)
hit+=.7;

}

});

});

return hit/Math.max(a.length,1);

}


function answer(q){

let best=null,score=0;

data.forEach(x=>x.k.forEach(k=>{

let s=sim(q,k);

if(s>score){
score=s;
best=x;
}

}));

return score>=.35
?best.r
:`Sorry bro 😅 mujhe is bare mein information nahi hai.<br><br>
Agar koi aur malomat chahiye to Developer se contact karein:<br><br>
<b>${email}</b>`;

}


function add(t,type,save=true){

let r=document.createElement("div");

r.className="msg "+type;

let d=document.createElement("div");

d.innerHTML=t;

r.appendChild(d);

chat.appendChild(r);

chat.scrollTop=chat.scrollHeight;

if(save){

let a=JSON.parse(
localStorage.getItem(KEY)||"[]"
);

a.push({t,type});

localStorage.setItem(
KEY,
JSON.stringify(a.slice(-300))
);

}

}


function load(){

let a=JSON.parse(
localStorage.getItem(KEY)||"[]"
);

if(!a.length)return;

document.getElementById("welcome")?.remove();

a.forEach(x=>
add(x.t,x.type,false)
);

}


function send(){

let q=inp.value.trim();

if(!q)return;

document.getElementById("welcome")?.remove();

add(escape(q),"user");

inp.value="";

let t=document.createElement("div");

t.className="msg bot";
t.id="typing";

t.innerHTML=
"<div class='typing'><span></span><span></span><span></span></div>";

chat.appendChild(t);

chat.scrollTop=chat.scrollHeight;

setTimeout(()=>{

document.getElementById("typing")?.remove();

add(answer(q),"bot");

inp.focus();

},500);

}


function ask(q){

inp.value=q;
send();

}


function escape(s){

let d=document.createElement("div");

d.textContent=s;

return d.innerHTML;

}


function clearChat(){

if(confirm("Delete all chat history?")){

localStorage.removeItem(KEY);

location.reload();

}

}


inp.addEventListener("keydown",e=>{

if(e.key=="Enter"){

e.preventDefault();
send();

}

});


document.addEventListener("contextmenu",e=>{

if(e.target!=inp)
e.preventDefault();

});


document.addEventListener("selectstart",e=>{

if(e.target!=inp)
e.preventDefault();

});


load();

setTimeout(()=>{
inp.focus();
},200);

</script>

</body>
</html>
